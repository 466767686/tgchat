org.gradle.jvmargs=-Xmx1800m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1200m
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# NOTE: this build machine is aarch64 and the Android SDK only ships an x86_64
# aapt2 binary. ./build.sh injects
#   -Pandroid.aapt2FromMavenOverride=/root/toolchain/aapt2-override/aapt2
# when that wrapper exists. On a normal x86_64 machine no override is needed.
