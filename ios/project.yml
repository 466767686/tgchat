name: TelegramClone
options:
  bundleIdPrefix: com.tgchat
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 156.0.0
  SDWebImageWebPCoder:
    url: https://github.com/SDWebImage/SDWebImageWebPCoder
    from: 0.15.0
  Lottie:
    url: https://github.com/airbnb/lottie-ios
    from: 4.5.0

targets:
  TgChat:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: TgChat
    dependencies:
      - package: WebRTC
      - package: SDWebImageWebPCoder
      - package: Lottie
    info:
      path: TgChat/Info.plist
      properties:
        CFBundleDisplayName: 计算器
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: 发送语音消息和通话需要使用麦克风
        NSCameraUsageDescription: 拍摄视频消息需要使用相机
        NSSpeechRecognitionUsageDescription: 语音转文字需要使用语音识别
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tgchat.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  TgChat:
    build:
      targets:
        TgChat: all
    run:
      config: Debug
    archive:
      config: Release
