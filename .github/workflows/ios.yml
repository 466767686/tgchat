name: iOS unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: xcodebuild -version && sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build (no code signing)
        working-directory: ios
        run: |
          xcodebuild \
            -project TelegramClone.xcodeproj \
            -scheme TgChat \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          set -e
          mkdir -p out/Payload
          cp -R ios/build/Build/Products/Release-iphoneos/TgChat.app out/Payload/
          cd out
          zip -qry TgChat-unsigned.ipa Payload
          ls -lh TgChat-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TgChat-unsigned-ipa
          path: out/TgChat-unsigned.ipa
          retention-days: 30
